<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Offis AF GDL - Catálogo</title>
    
    <style>
        /* ESTÉTICA FUTURISTA / GLASSMORPHISM (CYAN & MAGENTA) */
        body {
            background-color: #05070a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 15px;
            user-select: none;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #00aaff;
            margin: 0;
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 170, 255, 0.5);
        }

        header p {
            color: #ff00aa;
            margin: 5px 0 0;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* GRID HORIZONTAL DE 3 COLUMNAS POR FILA */
        .grid-catalogo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 854px;
            margin: 0 auto;
        }

        .card-anime {
            background: rgba(21, 24, 28, 0.6);
            border: 1px solid rgba(255, 0, 170, 0.2);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            aspect-ratio: 2/3;
        }

        .card-anime:active {
            transform: scale(0.96);
            border-color: #00aaff;
        }

        .card-anime img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(5,7,10,0.95) 40%, rgba(0,0,0,0) 100%);
            padding: 8px;
            box-sizing: border-box;
        }

        .card-info h3 {
            margin: 0;
            font-size: 0.75rem;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <header>
        <h1>Anime Offis TV</h1>
        <p>Streaming Hub Móvil</p>
    </header>

    <div class="grid-catalogo" id="contenedor-catalogo"></div>

    <script src="capacitor.js"></script>
    
    <script>
        // Extraemos las librerías nativas del core de Capacitor
        const { PushNotifications } = capacitor.Plugins;

        // --- SISTEMA ROBUSTO DE NOTIFICACIONES PUSH ---
        function inicializarNotificaciones() {
            if (!PushNotifications) {
                console.log("Entorno web detectado: El plugin nativo de Push no está disponible.");
                return;
            }

            // 1. Solicitar permisos al usuario de forma nativa en Android
            PushNotifications.requestPermissions().then((result) => {
                if (result.receive === 'granted') {
                    // 2. Si da permiso, registrar la app ante los servidores de Google FCM
                    PushNotifications.register();
                } else {
                    console.warn("El usuario denegó los permisos de notificación.");
                }
            });

            // 3. CONTROL DE FLUJO: Esperar a tener el token nativo en la mano ANTES de suscribirse
            PushNotifications.addListener('registration', (token) => {
                console.log('Token FCM generado con éxito. Conectando al canal...');
                
                // Suscripción segura al canal 'estrenos' mapeado en tu bot
                PushNotifications.subscribeTo({ topic: 'estrenos' })
                    .then(() => console.log('¡Suscrito con éxito al canal de estrenos!'))
                    .catch(err => console.error('Error al unirse al canal:', err));
            });

            // Alerta si ocurre un error en el registro nativo
            PushNotifications.addListener('registrationError', (error) => {
                console.error('Error crítico en el registro nativo de Firebase: ', error);
            });

            // 4. ¿Qué pasa si llega una notificación con la app abierta (Primer Plano)?
            PushNotifications.addListener('pushNotificationReceived', (notification) => {
                console.log('Notificación recibida en primer plano: ', notification);
                // Opcional: Puedes meter un aviso estético flotante aquí si quieres
            });

            // 5. ¿Qué pasa si el usuario pulsa la notificación flotante (Cerrada o Segundo Plano)?
            PushNotifications.addListener('pushNotificationActionPerformed', (action) => {
                console.log('El usuario tocó la notificación:', action.notification);
                // Redirigir directamente al catálogo o refrescar
                window.location.href = "index.html";
            });
        }

        // --- CARGA DINÁMICA DE TU CATÁLOGO ---
        function cargarCatalogo() {
            const CATALOGO_URL = "https://raw.githubusercontent.com/Destiny-oficial/Anime-OffisVD/main/catalogo.json";
            const contenedor = document.getElementById('contenedor-catalogo');

            fetch(CATALOGO_URL)
                .then(res => res.json())
                .then(animes => {
                    contenedor.innerHTML = ""; // Limpiar cargando
                    
                    animes.forEach(anime => {
                        const card = document.createElement('div');
                        card.className = "card-anime";
                        // Al hacer clic, redirige de forma nativa a video.html mandando las variables correctas
                        card.onclick = () => {
                            window.location.href = `video.html?anime=${anime.carpeta}&cap=af1`;
                        };

                        card.innerHTML = `
                            <img src="${anime.imagen || 'https://via.placeholder.com/150'}" alt="${anime.titulo}">
                            <div class="card-info">
                                <h3>${anime.titulo}</h3>
                            </div>
                        `;
                        contenedor.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error("Error cargando el catálogo de GitHub:", err);
                    contenedor.innerHTML = "<p style='color:#ff00aa; grid-column: span 3; text-align:center;'>Error de sincronización</p>";
                });
        }

        // --- ARRANQUE AUTOMÁTICO ---
        window.onload = () => {
            inicializarNotificaciones();
            cargarCatalogo();
        };
    </script>
</body>
</html>
