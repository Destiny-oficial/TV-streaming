name: Compilar APK de Anime Offis

on:
  push:
    branches:
      - main  # Si tu rama principal de GitHub se llama master, cambia "main" por "master"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java y Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Herramientas de Capacitor Globales
        run: npm install -g @capacitor/cli @capacitor/core  # 🚀 REPARADO: Esto le da el ejecutable al servidor

      - name: Instalar Dependencias del Proyecto y Sincronizar
        run: |
          npm install
          cap sync android  # 🚀 REPARADO: Ya no usa npx, usa el comando directo global

      - name: Fabricar APK Real (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Anime-Offis-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
