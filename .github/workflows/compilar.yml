name: Compilar APK de Anime Offis

on:
  push:
    branches:
      - main  # ⚠️ Si tu rama principal de GitHub se llama master, cambia "main" por "master"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo del Repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Configurar Java y Android SDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependencias del Proyecto
        run: |
          npm install
          npx cap sync android

      - name: Fabricar APK Real (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Guardar APK como Artefacto
        uses: actions/upload-artifact@v3
        with:
          name: TV-STREAMING
          path: android/app/build/outputs/apk/debug/app-debug.apk